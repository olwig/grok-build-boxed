name: Build and push to GHCR

on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - Containerfile.sudo
      - .github/workflows/ghcr.yml
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      default: ${{ steps.filter.outputs.default }}
      sudo: ${{ steps.filter.outputs.sudo }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            default:
              - Containerfile
            sudo:
              - Containerfile.sudo
            workflow:
              - .github/workflows/ghcr.yml

  build-default:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.default == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set timestamp tag
        id: vars
        run: echo "timestamp=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.timestamp }}

  build-sudo:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.sudo == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set timestamp tag
        id: vars
        run: echo "timestamp=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile.sudo
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}:sudo-latest
            ghcr.io/${{ github.repository }}:sudo-${{ steps.vars.outputs.timestamp }}
